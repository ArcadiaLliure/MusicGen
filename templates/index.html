<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcàdia Lliure Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/ui/tokens.css">
    <link rel="stylesheet" href="/static/ui/components.css">
    <link rel="stylesheet" href="/static/ui/layout.css">
</head>
<body>
<header class="topbar">
    <div class="brand">
        <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 26 26" fill="none" stroke="#F7F3EB" stroke-width="2.2" stroke-linecap="round">
                <path d="M4 13v0M8 9v8M12 5v16M16 8v10M20 11v4"/>
            </svg>
        </span>
        <div>
            <span class="kicker">Estudi musical</span>
            <h1>Arcàdia Lliure Studio</h1>
        </div>
    </div>
    <nav class="segmented" role="tablist" aria-label="Vistes">
        <button class="tab active" data-tab="gen" role="tab" aria-selected="true">Generador</button>
        <button class="tab" data-tab="lib" role="tab" aria-selected="false">Biblioteca</button>
    </nav>
</header>

<main class="page">
    <section id="view-gen" class="gen-grid">
        <div>
            <article class="card">
                <div class="card-head">
                    <div>
                        <span class="kicker">Estudi</span>
                        <h2 class="section-title" id="studioTitle">Pista única</h2>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="modeAlbumToggle">
                        <span class="track" aria-hidden="true"></span>
                        <span>Mode àlbum</span>
                    </label>
                </div>
                <div class="card-body stack">
                    <div class="identity-grid">
                        <div class="identity-fields">
                            <div>
                                <label class="label" for="title" id="titleLabel">Títol cançó</label>
                                <input type="text" id="title" class="field field-lg" placeholder="Escriu el títol...">
                            </div>
                            <div>
                                <label class="label" for="artist">Artista</label>
                                <input type="text" id="artist" class="field" value="AI Producer">
                            </div>
                            <div>
                                <label class="label" for="model">Model d'IA musical</label>
                                <select id="model" class="field">
                                    <option value="facebook/musicgen-small">MusicGen Small (Ràpid, 300M)</option>
                                    <option value="facebook/musicgen-medium">MusicGen Medium (1.5B)</option>
                                    <option value="facebook/musicgen-large">MusicGen Large (3.3B)</option>
                                    <option value="facebook/musicgen-melody" selected>MusicGen Melody (Àlbum i inspiracions, 1.5B)</option>
                                </select>
                            </div>
                        </div>
                    </div>

                        
                        <div id="albumPanel" class="album-panel" hidden>
                        <div class="panel-row">
                            <div class="segmented" id="albumModeSeg" role="tablist" aria-label="Mode de l'àlbum">
                                <button data-mode="auto" class="active">Automàtic</button>
                                <button data-mode="manual">Manual</button>
                            </div>
                            <span class="muted small" id="albumModeHint"></span>
                        </div>
                        <div>
                            <label class="label" for="albumPrompt">Prompt global</label>
                            <textarea id="albumPrompt" class="field" rows="2" placeholder="Ex: banda sonora orquestral cinematogràfica, cordes i metalls..."></textarea>
                        </div>
                        <div id="autoFields" class="inline-row wrap">
                            <div>
                                <label class="label" for="autoCount">Nombre de pistes</label>
                                <input type="number" id="autoCount" class="field" value="3" min="1" max="20">
                            </div>
                            <div>
                                <label class="label" for="autoDuration">Durada per pista (s)</label>
                                <input type="number" id="autoDuration" class="field" value="30" min="1" max="30">
                            </div>
                        </div>
                        <div id="manualFields" class="inline-row wrap" hidden>
                            <div>
                                <label class="label" for="manualCount">Nombre de pistes</label>
                                <input type="number" id="manualCount" class="field" value="1" min="1" max="20">
                            </div>
                            <label class="switch" id="sameWrap">
                                <input type="checkbox" id="sameInstruments" checked>
                                <span class="track" aria-hidden="true"></span>
                                <span>Mateixos instruments en tot l'àlbum</span>
                            </label>
                        </div>
                    </div>

                        <!-- PREVIEW ROW -->
                        <div class="full-width-preview" style="margin-bottom: var(--s-5);">
                            <span class="label">Caràtula o vídeo loop</span>
                            
                            <div class="cover-controls panel-row" style="margin-bottom: 16px;">
                                <span data-icon="image"></span>
                                <button class="btn btn-ghost btn-sm" id="btnUploadCover"><span data-icon="upload"></span> Pujar arxiu</button>
                                <div class="inline-row">
                                    <select id="comfyModelSelect" class="field field-sm"></select>
                                    <button class="icon-btn danger" id="btnDeleteModel" hidden title="Esborrar model"><span data-icon="trash"></span></button>
                                </div>
                                <div class="progress" id="downloadProgressBox" hidden><span id="downloadProgressBar"></span></div>
                                <input type="text" id="coverPrompt" class="field field-sm" placeholder="Prompt de la caràtula (opcional)">
                                <button class="btn btn-primary btn-sm" id="btnComfyUI"><span data-icon="spark"></span> Generar amb IA</button>
                            </div>
                            
                            <div id="coverBox" class="cover-box yt-preview-mode">
                                <img id="coverImgPreview" class="cover-media" hidden alt="">
                                <video id="coverVidPreview" class="cover-media" hidden autoplay loop muted></video>
                                <div class="yt-overlay" id="ytOverlay">
                                    <div class="yt-top">
                                        <div class="yt-title" id="ytTitlePreview">Títol - Artista</div>
                                    </div>
                                    <div class="yt-bottom">
                                        <div class="yt-progress">
                                            <div class="yt-progress-bar"></div>
                                            <div class="yt-chapters" id="ytChapters"></div>
                                        </div>
                                        <div class="yt-controls">
                                            <div class="yt-controls-left">
                                                <svg viewBox="0 0 24 24" class="yt-icon"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
                                                <svg viewBox="0 0 24 24" class="yt-icon"><path fill="currentColor" d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                                                <svg viewBox="0 0 24 24" class="yt-icon"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                                                <span class="yt-time" id="ytTimePreview">0:00 / 0:00</span>
                                            </div>
                                            <div class="yt-controls-right">
                                                <svg viewBox="0 0 24 24" class="yt-icon"><path fill="currentColor" d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
                                                <svg viewBox="0 0 24 24" class="yt-icon"><path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <input type="file" id="coverInput" hidden accept="image/*,video/*,.gif">
                                <input type="hidden" id="currentCoverPath">
                            </div>
                        </div>

                    <div class="inspiration" id="inspirationPanel">
                        <div class="inspiration-tabs">
                            <div>
                                <span class="kicker">Referència</span>
                                <h3 class="section-title-sm">Inspiració</h3>
                            </div>
                            <div class="segmented" id="inspTabs" role="tablist" aria-label="Inspiracions">
                                <button data-tab="fav" class="active">Favorits</button>
                                <button data-tab="rec">Recents</button>
                                <button data-tab="new">Carregar-ne una altra</button>
                            </div>
                        </div>
                        <div id="activeInspiration"></div>
                        <div id="inspContent"></div>
                    </div>

                    <section class="instruments">
                        <div class="inline-between wrap">
                            <span class="label">Wizard d'instruments</span>
                            <div class="legend">
                                <span class="badge badge-success">Obligatori</span>
                                <span class="badge badge-accent">Opcional</span>
                                <span class="badge badge-error">Prohibit</span>
                            </div>
                        </div>
                        <div class="wizard-grid" id="instrumentGrid"></div>
                    </section>

                    <section>
                        <h3 class="section-title-sm" id="tracksTitle">Pista</h3>
                        <div id="tracksContainer" class="tracks"></div>
                    </section>

                    <div class="inline-between wrap">
                        <label class="switch">
                            <input type="checkbox" id="notifySound" checked>
                            <span class="track" aria-hidden="true"></span>
                            <span>Avisar amb so en acabar cada pista</span>
                        </label>
                    </div>
                    <button id="submitBtn" class="btn btn-primary btn-lg btn-block"><span data-icon="play"></span> Produir ara</button>
                </div>
            </article>
        </div>

        <aside class="col-side">
            <article class="card queue">
                <div class="card-head">
                    <div>
                        <span class="kicker">Procés</span>
                        <h2 class="section-title-sm">Cua de treball</h2>
                    </div>
                    <span class="spinner" id="queueSpinner" hidden></span>
                </div>
                <ul class="queue-list" id="queueList"></ul>
            </article>
        </aside>
    </section>

    <section id="view-lib" hidden>
        <article class="card">
            <div class="card-head">
                <div>
                    <span class="kicker">Col·lecció</span>
                    <h2 class="section-title">Biblioteca</h2>
                </div>
                <button class="btn btn-ghost btn-sm" id="btnRefreshLib"><span data-icon="chevron"></span> Refrescar</button>
            </div>
            <div class="card-body" id="libraryContainer"></div>
        </article>
    </section>
</main>

<div id="taskTray" class="task-tray" hidden></div>
<div id="toasts" class="toasts"></div>
<div id="overlay" class="overlay"><div id="overlayCard" class="dialog"></div></div>

<div id="playerBar" class="player-bar" hidden>
    <audio id="player" preload="metadata"></audio>
    <div class="player-info">
        <span class="kicker">Reproduint</span>
        <strong id="playerTitle"></strong>
    </div>
    <div class="player-controls">
        <button class="icon-btn" id="btnPrev" title="Anterior"><span data-icon="prev"></span></button>
        <button class="btn btn-primary btn-sm" id="btnPlayPause" title="Reproduir o pausar"><span data-icon="play"></span></button>
        <button class="icon-btn" id="btnNext" title="Següent"><span data-icon="next"></span></button>
    </div>
    <div class="player-progress">
        <input type="range" id="playerSeek" min="0" max="1000" value="0" aria-label="Posició">
        <span id="playerTime">0:00 / 0:00</span>
    </div>
    <button class="icon-btn" id="btnClosePlayer" title="Tancar reproductor"><span data-icon="close"></span></button>
</div>

<script src="/static/ui/app.js?v=1791681600"></script>
</body>
</html>
